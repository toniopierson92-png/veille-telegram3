# ─────────────────────────────────────────────────────────────────────────────
#  RÉGLAGES GÉNÉRAUX
# ─────────────────────────────────────────────────────────────────────────────
reglages:
  heure_resume: 20            # heure (Paris) d'envoi du résumé quotidien
  sujets_dans_resume: 10      # nb de sujets détaillés "À la une"
  breves_dans_resume: 12      # nb de sujets en une ligne "Aussi dans l'actu"

  # Hiérarchie : un sujet est noté selon le nombre de médias DIFFÉRENTS qui le couvrent
  # (chaque média compte pour son "poids", 1 par défaut).
  seuil_important: 3          # 🟠 à partir de 3 médias
  seuil_majeur: 5             # 🔴 à partir de 5 médias

  # Mots qui donnent +1 au score d'un sujet (urgence, gravité, exclusivité)
  mots_importants: [urgent, alerte, exclusif, officiel, démission, démissionne, mort, décès,
                    attentat, séisme, guerre, élection, dissolution, 49.3, motion de censure,
                    record, faillite, licenciements, krach, finale, sacré, champion du monde,
                    breaking, dies, resigns]

  # Comment le bot te prévient en direct (modifiable par thème avec "alertes:") :
  #   toutes      -> chaque article de chaque média (beaucoup de messages)
  #   sujets      -> 1 message par nouveau sujet, puis 🔴 s'il devient majeur  (recommandé)
  #   importantes -> seulement quand un sujet devient 🟠 important ou 🔴 majeur
  alertes: sujets

# ─────────────────────────────────────────────────────────────────────────────
#  THÈMES ET SOURCES
#  Format d'une source : - {nom: Nom du média, url: adresse du flux RSS}
#  Options : poids: 2 (compte double dans la hiérarchie), rubrique: Cinéma
#  Plusieurs flux avec le même "nom" comptent comme un seul média.
# ─────────────────────────────────────────────────────────────────────────────
themes:

  politique:
    emoji: "🏛️"
    token_env: TOKEN_POLITIQUE
    flux:
      # Généralistes / service public
      - {nom: Le Monde, url: "https://www.lemonde.fr/politique/rss_full.xml"}
      - {nom: franceinfo, url: "https://www.francetvinfo.fr/politique.rss"}
      - {nom: 20 Minutes, url: "https://www.20minutes.fr/feeds/rss-politique.xml"}
      - {nom: BFMTV, url: "https://www.bfmtv.com/rss/politique/"}
      - {nom: Le Parisien, url: "https://feeds.leparisien.fr/leparisien/rss/politique"}
      # Gauche
      - {nom: Libération, url: "https://www.liberation.fr/arc/outboundfeeds/rss-all/category/politique/?outputType=xml"}
      - {nom: Mediapart, url: "https://www.mediapart.fr/articles/feed"}
      - {nom: L'Humanité, url: "https://www.humanite.fr/feed"}
      # Centre / souverainiste
      - {nom: Marianne, url: "https://www.marianne.net/rss.xml"}
      # Droite / libéral
      - {nom: Le Figaro, url: "https://www.lefigaro.fr/rss/figaro_politique.xml"}
      - {nom: Le Point, url: "https://www.lepoint.fr/politique/rss.xml"}
      - {nom: L'Opinion, url: "https://www.lopinion.fr/feed"}
      - {nom: Valeurs actuelles, url: "https://www.valeursactuelles.com/feed"}
      # Institutions
      - {nom: Public Sénat, url: "https://www.publicsenat.fr/rss.xml"}
      # International (regard étranger)
      - {nom: Le Monde, url: "https://www.lemonde.fr/international/rss_full.xml", rubrique: International}
      - {nom: France 24, url: "https://www.france24.com/fr/france/rss"}
      - {nom: RFI, url: "https://www.rfi.fr/fr/france/rss"}
      - {nom: Courrier international, url: "https://www.courrierinternational.com/feed/all/rss.xml", rubrique: International}
      - {nom: Euronews, url: "https://fr.euronews.com/rss?level=theme&name=news", rubrique: International}
      - {nom: Politico Europe, url: "https://www.politico.eu/feed/", rubrique: Europe}
      - {nom: The Guardian, url: "https://www.theguardian.com/world/rss", rubrique: International}

