      - {nom: Libération, url: "https://www.liberation.fr/arc/outboundfeeds/rss-all/category/economie/?outputType=xml"}
      - {nom: Le Monde, url: "https://www.lemonde.fr/economie/rss_full.xml"}
      - {nom: Le Figaro, url: "https://www.lefigaro.fr/rss/figaro_economie.xml"}
      - {nom: Le Point, url: "https://www.lepoint.fr/economie/rss.xml"}
