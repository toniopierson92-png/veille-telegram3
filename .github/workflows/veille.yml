name: Veille actu Telegram

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Alertes en direct + résumé quotidien
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOKEN_POLITIQUE: ${{ secrets.TOKEN_POLITIQUE }}
          TOKEN_ECONOMIE: ${{ secrets.TOKEN_ECONOMIE }}
          TOKEN_SPORT: ${{ secrets.TOKEN_SPORT }}
          TOKEN_ART: ${{ secrets.TOKEN_ART }}
          TOKEN_FINANCE: ${{ secrets.TOKEN_FINANCE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TZ: Europe/Paris
        run: python veille.py
      - name: Mémoriser les articles déjà envoyés
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add etat/ || true
          git diff --cached --quiet || git commit -m "maj état veille" -q
          git pull --rebase -q && git push -q
